spring.application.name=paiementMS
server.port=8088


spring.config.import=optional:configserver:

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/catchop_paiement_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost
# Include the reason of an error (e.g. "Insufficient funds") in the JSON body, for the apps
server.error.include-message=always
