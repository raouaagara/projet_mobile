spring.application.name=CommunityMicroService
server.port=8090


spring.config.import=optional:configserver:

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/catchop_community_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Include the reason of an error (e.g. "This group is private") in the JSON body, for the apps
spring.web.error.include-message=always

# IA du module 6 (modération, recommandations, rédaction) : la clé vient de GEMINI_API_KEY, jamais du code.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
