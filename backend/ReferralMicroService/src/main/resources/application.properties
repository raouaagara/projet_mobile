spring.application.name=ReferralMicroService
server.port=8092

spring.datasource.url=jdbc:mysql://localhost:3306/catchop_Referral_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

referral.availability.enabled=true

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost

# Include the reason of an error (e.g. "You can't use your own referral code") in the JSON body, for the apps
spring.web.error.include-message=always

# IA du module 5 : la clé vient de la variable d'environnement GEMINI_API_KEY, jamais du code.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
