spring.application.name=UserMicroService
server.port=8083


spring.config.import=optional:configserver:

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/catchop_user_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost

# JWT : la valeur par défaut sert uniquement en dev. En prod, définir JWT_SECRET (32 caractères minimum)
jwt.secret=${JWT_SECRET:catchopp-dev-secret-change-me-please-32bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Upload de CV (PDF) : la limite par défaut de Spring est 1MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
