spring.application.name=ProjectMicroService
server.port=8082


spring.config.import=optional:configserver:

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/catchop_project_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost
# Include the reason of an error (e.g. "You already sent a proposal") in the JSON body, for the apps
spring.web.error.include-message=always

# IA du module 2 : la clé vient de la variable d'environnement GEMINI_API_KEY, jamais du code.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# Service Python SkillExtractorAI (score de correspondance freelancer ↔ offres)
skill-extractor.url=${SKILL_EXTRACTOR_URL:http://localhost:8093}
# Service Competence (noms des compétences pour le score)
competence.url=${COMPETENCE_URL:http://localhost:8084}
