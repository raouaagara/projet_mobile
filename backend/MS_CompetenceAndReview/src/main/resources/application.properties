spring.application.name=MSCompetenceAndReview
server.port=8084

spring.config.import=optional:configserver:


spring.datasource.url=jdbc:mysql://localhost:3306/catchop_competence_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost

# Clé Gemini (modération + amélioration des avis) : définir GEMINI_API_KEY, ne jamais la committer
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Upload de CV (PDF) : la limite par défaut de Spring est 1MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Service IA d'extraction de competences (backend/SkillExtractorAI). Si indisponible : recherche par mots-cles.
skill-extractor.url=${SKILL_EXTRACTOR_URL:http://localhost:8093}
