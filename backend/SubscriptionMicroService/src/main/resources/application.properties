spring.application.name=SubscriptionMicroService
server.port=8091

spring.config.import=optional:configserver:

# MySQL Database - SubscriptionDB
spring.datasource.url=jdbc:mysql://localhost:3306/catchop_Subscription_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ayoub.somrani00@gmail.com
# Never commit the real value: set MAIL_PASSWORD in your environment / .env
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Application Email Settings
app.email.from=ayoub.somrani00@gmail.com
app.email.support=ayoub.somrani00@gmail.com


# Flouci Payment Gateway Configuration
# Get your credentials from: https://developers.flouci.com/
flouci.app.token=YOUR_FLOUCI_APP_TOKEN
flouci.app.secret=YOUR_FLOUCI_APP_SECRET

# Include the reason of an error (e.g. "This promo code has expired") in the JSON body, for the apps
spring.web.error.include-message=always

# IA du module 5 : la clé vient de la variable d'environnement GEMINI_API_KEY, jamais du code.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
