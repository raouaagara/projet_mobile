    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/catchopp_referral?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
