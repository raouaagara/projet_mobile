spring.application.name=MSCommunication
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/catchop_chat_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update


eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost

# Attachments up to 10 MB (images, PDFs)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Attachment links go through the gateway so phones can open them
chat.public-base-url=${CHAT_PUBLIC_BASE_URL:http://localhost:8085}

# IA du module 4 (modération et réponses suggérées) : la clé vient de GEMINI_API_KEY, jamais du code.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Include the reason of an error (e.g. "Not enough messages") in the JSON body, for the apps
spring.web.error.include-message=always
