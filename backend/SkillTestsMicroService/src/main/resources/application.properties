spring.application.name=SkillTestsMicroService
server.port=8089

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://localhost:3306/catchop_SkillTestsDB_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IA : Gemini par défaut pour les tests et l'assistant CV (AI_PROVIDER=openai pour les tests avec OpenAI).
# Les clés viennent de l'environnement, jamais de ce fichier. Sans clé, ces fonctions répondent 503 avec un message clair.
ai.provider=${AI_PROVIDER:gemini}
ai.openai.api-key=${OPENAI_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

