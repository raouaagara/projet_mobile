spring.application.name=TechnicalSupportMS
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/catchop_support_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# En local tout tourne sur la même machine : s'enregistrer comme localhost évite les pannes
# quand l'IP du PC change (Wi-Fi, partage de connexion). Docker surcharge via EUREKA_INSTANCE_HOSTNAME.
eureka.instance.hostname=localhost


# IA (Gemini) : rédaction, résumé et tri des demandes. Clé dans la variable d'environnement GEMINI_API_KEY,
# jamais dans ce fichier. Sans clé, les demandes sont triées par mots-clés et le bouton IA explique pourquoi.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# SLA settings (hours)
support.sla.low=72
support.sla.medium=48
support.sla.high=24
support.sla.critical=4

# Scheduler: run every hour
support.scheduler.cron=0 0 * * * *

# Include the reason of an error (e.g. "Not enough messages") in the JSON body, for the apps
spring.web.error.include-message=always
